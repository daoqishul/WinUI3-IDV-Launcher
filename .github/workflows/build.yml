name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore winui/IdvLauncher.csproj -p:Platform=x64

      - name: Build
        run: dotnet build winui/IdvLauncher.csproj -c Release -p:Platform=x64 --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdvLauncher-win-x64
          path: winui/bin/x64/Release/net8.0-windows10.0.19041.0
          if-no-files-found: error
