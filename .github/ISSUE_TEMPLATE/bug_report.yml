name: Bug report
description: 报告启动器问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认使用的是最新 Release，并附上相关日志。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 启动器版本
      placeholder: v1.0.0 / 安装包或便携版
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 x64
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 可粘贴 `C:\ProgramData\idv-login\log.txt` 的相关片段
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有重复问题
          required: true
        - label: 我使用的是最新版本
          required: true
